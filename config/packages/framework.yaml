# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    # Cookie de session pour l'API (même origine) : HttpOnly + SameSite=Lax (voir docs/api.md).
    session:
        cookie_httponly: true
        cookie_samesite: lax

    rate_limiter:
        # Recherche par plaque (API RapidAPI à quota) : par foyer, voir VehicleController::lookup.
        vehicle_lookup:
            policy: sliding_window
            limit: 20
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
