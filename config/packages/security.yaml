security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\Member: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Membres du foyer = utilisateurs de connexion (identifiant : username).
        app_member_provider:
            entity:
                class: App\Entity\Member
                property: username

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_member_provider
            # Authentification par session/cookie pour l'API JSON (voir docs/api.md).
            json_login:
                check_path: api_login
                username_path: username
                password_path: password
                success_handler: App\Security\JsonLoginSuccessHandler
                failure_handler: App\Security\JsonLoginFailureHandler
            logout:
                path: api_logout
                enable_csrf: false
                # La réponse 204 est posée par App\Security\ApiLogoutListener (LogoutEvent).
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            entry_point: App\Security\ApiAuthenticationEntryPoint

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: '^/api/(login|health)', roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: ROLE_USER }
        # Le reste (coquille SPA) est public.

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            App\Entity\Member:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
