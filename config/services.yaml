# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Fichier INI des alias de comptes (section [comptes], clé = numéro normalisé sans espaces).
    app.accounts_ini: '%kernel.project_dir%/data/comptes.ini'
    # Dossier de conservation des fichiers uploadés via POST /api/imports (voir docs/api.md).
    app.uploads_dir: '%kernel.project_dir%/data/uploads'
    # Dossier des dumps pg_dump (app:backup, voir docs/adr/0019-backups-automatisees.md).
    app.backups_dir: '%kernel.project_dir%/data/backups'
    # Replis des variables d'env backup si absentes des fichiers .env.
    app.backup_keep_default: 14
    app.backup_interval_default: '1d'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Service de recherche de véhicule par plaque, choisi selon VEHICLE_LOOKUP_PROVIDER
    # (« none » → NullVehicleLookup, « rapidapi » → RapidApiVehicleLookup).
    App\Vehicle\Lookup\VehicleLookup:
        factory: ['@App\Vehicle\Lookup\VehicleLookupFactory', 'create']

    # Backups de la base (app:backup) : BACKUP_DIR permet de surcharger le dossier en test.
    App\Backup\BackupManager:
        $databaseUrl: '%env(resolve:DATABASE_URL)%'
        $backupDir: '%env(default:app.backups_dir:BACKUP_DIR)%'
        $keep: '%env(int:default:app.backup_keep_default:BACKUP_KEEP)%'

    App\Command\BackupCommand:
        $defaultInterval: '%env(default:app.backup_interval_default:BACKUP_INTERVAL)%'
